[package]
name = "randex"
version = "0.1.0"
description = "Tracker fuer Pokemon-Randomizer-Runs"
authors = ["Marlon Schmitz"]
edition = "2021"

[lib]
name = "randex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
